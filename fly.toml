# fly.toml app configuration file generated for ring-journal on 2026-09-08T15:51:35Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ring-journal'
primary_region = 'ams'

[build]

[env]
  AI_DAY_MODEL = 'claude-opus-5'
  AI_ENABLED = 'true'
  AI_TITLE_MODEL = 'claude-haiku-4-5'
  DATA_DIR = '/data'
  HOST = '0.0.0.0'
  JOURNAL_TZ = 'Europe/Berlin'
  PORT = '3000'

[[mounts]]
  source = 'journal_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
