# Fly.io deployment. `fly launch --no-deploy` will offer to rewrite this file —
# keep the [mounts] block and the health check if you let it.

app = "journal"          # must be globally unique; change it
primary_region = "fra"   # pick one near you: fly platform regions

[build]

[env]
  # DATA_DIR must point at the mounted volume below. Everything the journal
  # owns — the SQLite database and every media file — lives under it, because
  # the rest of the filesystem is replaced on every deploy.
  DATA_DIR = "/data"
  PORT = "3000"
  HOST = "0.0.0.0"
  JOURNAL_TZ = "Europe/Berlin"
  AI_ENABLED = "true"
  AI_TITLE_MODEL = "claude-haiku-4-5"
  AI_DAY_MODEL = "claude-opus-5"

[http_service]
  internal_port = 3000
  force_https = true
  # Kept always-on deliberately: a stopped Machine still wakes on an incoming
  # request, but the cold start adds latency to a ring delivery, and the
  # debounced day-summary job will not fire while nothing is running.
  # For scale-to-zero instead, set auto_stop_machines = "stop" and
  # min_machines_running = 0 — see README.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# One volume, one Machine, one region. SQLite plus a local media directory
# needs a single writer, so this app does not scale horizontally by design.
[mounts]
  source = "journal_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
